name: Hourly Weather Automation

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  logging_job:
    runs-on: ubuntu-latest
    env:
      # This clears that deprecation warning
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Note: check if v5 is out for your runner

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv

      - name: Debug File Path
        run: find . -name "weather_logger.py"

      - name: Execute Script
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        # Using the full workspace variable is the safest way in 2026
        run: python -u /scripts/weather_logger.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git pull origin main --rebase
          git add overnight_weather.csv
          git commit -m "🤖 Automated Data Log: $(date)" || echo "No changes to commit"
          git push