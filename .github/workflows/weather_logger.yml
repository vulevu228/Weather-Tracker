name: Hourly Weather Automation

on:
  schedule:
    - cron: '0 * * * *'  # Runs every hour
  workflow_dispatch:      # Adds a "Run" button on GitHub for manual testing

jobs:
  logging_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install pandas requests python-dotenv

      - name: Execute Script
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u scripts/weather_logger.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add overnight_weather.csv
          git commit -m "🤖 Weather Log Update: $(date)" || echo "No changes to commit"
          git push